name: Validate Knight V2 foundation

on:
  push:
    branches:
      - balance-v2-knight-foundation
  workflow_dispatch:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile model and validator
        run: python -m py_compile balance_report/v2_knight_ttk.py balance_report/validate_knight_v2.py
      - name: Validate Knight foundation
        run: python balance_report/validate_knight_v2.py
      - name: Estimate level 1000 Knight versus a new monster
        run: python balance_report/v2_knight_ttk.py --level 1000 --skill 95 --attack 110 --ml 8 --exit-level 1500 --exit-skill 110 --exit-attack 160
      - name: Install Lua syntax checker
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Compile edited Lua scripts (syntax only)
        run: |
          for file in \
            data/scripts/spells/attack/berserk.lua \
            data/scripts/spells/attack/fierce_berserk.lua \
            data/scripts/spells/attack/front_sweep.lua \
            data/scripts/spells/attack/groundshaker.lua \
            data/scripts/spells/attack/brutal_strike.lua \
            data/scripts/spells/attack/annihilation.lua \
            data/scripts/spells/healing/wound_cleansing.lua \
            data/scripts/spells/healing/fair_wound_cleansing.lua \
            data/scripts/spells/healing/intense_wound_cleansing.lua \
            data/scripts/actions/items/potions.lua \
            data-canary/scripts/Customs/Superfood.lua; do
            luac -p "$file"
          done
