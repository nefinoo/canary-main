name: Apply Frozen Hell V2 Knight items

on:
  push:
    branches:
      - balance-v2-knight-foundation
    paths:
      - 'balance_report/apply_knight_v2_items.py'

permissions:
  contents: write

jobs:
  apply-items:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: balance-v2-knight-foundation
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply weapon edits and check XML
        run: python balance_report/apply_knight_v2_items.py
      - name: Commit items.xml if modified
        run: |
          if git diff --quiet -- data/items/items.xml; then
            echo "Items already balanced; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items/items.xml
          git commit -m "balance(v2 knight): level 1000 Deadly quest weapons"
          git push origin HEAD:balance-v2-knight-foundation
