---
name: Apply Frozen Hell quest weapons and Knight equipment augments

on:
  push:
    branches:
      - balance-frozen-hell-knight-100-200
    paths:
      - balance_report/fix_level100_quest_weapons.py
      - balance_report/apply_knight_augments.py
      - balance_report/apply_outlawed_dwarf_augments.py
      - balance_report/apply_elven_stage4.py
      - balance_report/apply_elven_stage5.py
      - balance_report/apply_green_demon_stage10.py
      - balance_report/validate_phase10.py
      - .github/workflows/apply-frozen-hell-quest-weapons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-items-xml:
    if: github.ref == 'refs/heads/balance-frozen-hell-knight-100-200'
    runs-on: ubuntu-latest
    steps:
      - name: Check out balance branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply ID-validated quest weapon corrections
        run: python3 balance_report/fix_level100_quest_weapons.py --apply
      - name: Apply ID-validated equipment augments
        run: python3 balance_report/apply_knight_augments.py --apply
      - name: Apply Outlawed Dwarf equipment augments
        run: python3 balance_report/apply_outlawed_dwarf_augments.py --apply
      - name: Apply level-650 Elven set and remove premature drops
        run: python3 balance_report/apply_elven_stage4.py --apply
      - name: Apply level-850 rare gear and 850-1000 combat balancing
        run: python3 balance_report/apply_elven_stage5.py --apply
      - name: Apply level-1000 universal Green Demon equipment
        run: python3 balance_report/apply_green_demon_stage10.py --apply
      - name: Validate level-1000 boss and universal gear
        run: python3 balance_report/validate_phase10.py
      - name: Validate Frozen Hell level-850 progression
        run: python3 balance_report/validate_phase5.py
      - name: Commit stage-4 changes (only if changed)
        shell: bash
        run: |
          git add data/items/items.xml data-canary/monster/Custom
          if git diff --cached --quiet; then
            echo "Quest weapons, equipment and staged loot are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "balance: apply staged rare gear and phase 5 monster progression"
          git push origin HEAD:balance-frozen-hell-knight-100-200
